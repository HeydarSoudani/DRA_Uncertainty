# ============================================================================
# Settings of experiments/belief_model_training.py (belief model training,
# agent frozen).  One section per phase plus `shared`; the keys are the
# dataclass fields of src/belief_model_training/config.py.
#
# Precedence (lowest -> highest):
#   dataclass defaults  <  this file  <  CLI flags  <  --set section.key=value
#
# Hyperparameters follow Agent-BRACE's recipes (arXiv 2605.11436):
# recipes/finetune_belief_qwen25_3b.sh (sft) and
# recipes/textworld_basic_ppo_decouple_joint_belief_vllm.sh (rl).
# A split is dataset[:subset[:dataset_year]], e.g. trqa:wiki1:validation.
# ============================================================================

# ── Shared ───────────────────────────────────────────────────────────────────
shared:
  run_name: default
  output_root: null                 # null = OUTPUT_ROOT/belief_model_training
  seed: 0
  inference_config: experiments/configs/dra_inference.yaml  # agent/retriever/belief settings of phases 1 and 4
  retriever: qwen3_emb_4b
  num_gpus: 4                       # dra_inference workers (phases 1 and 4)

# ── Phase 0: training queries (TODO) ─────────────────────────────────────────
queries: {}

# ── Phase 1: teacher trajectories (monitor mode) ─────────────────────────────
trajectories:
  agent: glm                                  # frozen agent (--agentic-model)
  teacher_model: openrouter/qwen/qwen3.6-27b  # belief updater whose replies are the SFT targets
  criteria_model: openrouter/qwen/qwen3.6-27b # criteria extraction (frozen, criteria bank)
  require_verified_spans: true                # SFT samples only from replies whose spans all occur in their passage

# ── Phase 2: SFT warm-up (LoRA, then merged) ─────────────────────────────────
sft:
  student_model: Qwen/Qwen3-4B-Instruct-2507
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  learning_rate: 2.0e-5
  num_epochs: 5
  per_device_batch_size: 4
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  max_length: 16384                 # longer samples (prompt + reply, tokens) are dropped
  logging_steps: 5
  save_steps: 100

# ── Phase 3: RL (Agent-BRACE belief PPO; no critic, no KL) ───────────────────
rl:
  student_init: null                # null = phase2_sft/merged
  judge_model: null                 # reward judge (rewards TODO)
  env: replay                       # replay (phase 1 trajectories) | online (TODO)
  num_iterations: 200
  episodes_per_batch: 16
  max_episode_steps: null           # null = whole episodes
  learning_rate: 1.0e-5
  ppo_epochs: 1
  ppo_mini_batch_size: 4
  clip_ratio: 0.2
  clip_ratio_c: 3.0
  loss_agg_mode: token-mean
  grad_clip: 1.0
  use_kl_loss: false
  kl_loss_coef: 0.001
  kl_loss_type: low_var_kl
  temperature: 1.0
  max_new_tokens: 4096
  vllm_gpu_memory_utilization: 0.55
  vllm_max_model_len: 32768
  vllm_max_num_seqs: 16
  save_every: 20
  sync_dir: /dev/shm/belief_model_training_sync

# ── Phase 4: evaluation (existing evaluators) ────────────────────────────────
eval:
  belief_model: null                # null = phase3_rl/final
  agent: null                       # null = trajectories.agent
  splits: []                        # e.g. [trqa:wiki1:test, browsecomp_plus]
  variants: [off, teacher, student]
  inference_gpu_ids: "1,2,3"        # inference workers; keep serve_gpu out
  serve_gpu: 0                      # vLLM server of the student
  serve_port: 6020
  serve_max_model_len: 32768
  serve_gpu_memory_utilization: 0.85

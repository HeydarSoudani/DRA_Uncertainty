# ============================================================================
# Settings of experiments/training/belief_model_training.py (belief model training,
# agent frozen).  One section per phase plus `shared`; the keys are the
# dataclass fields of src/belief_model_training/config.py.
#
# Precedence (lowest -> highest):
#   dataclass defaults  <  this file  <  CLI flags
#
# Hyperparameters follow Agent-BRACE's recipes (arXiv 2605.11436):
# recipes/finetune_belief_qwen25_3b.sh (sft) and
# recipes/textworld_basic_ppo_decouple_joint_belief_vllm.sh (rl).
# ============================================================================

# ── Shared ───────────────────────────────────────────────────────────────────
shared:
  training_data: deep_qa            # training pool: deep_qa | trqa_validation (build_training_pool.py)
  policy_model: glm                 # frozen agent (--policy-model): phase 1 runs it, phases 2-3 read its runs
                                    # and write to {output_root}/{training_data}/{policy_model}
  output_root: null                 # null = OUTPUT_ROOT/belief_model_training
  seed: 0
  inference_config: experiments/configs/dra_inference.yaml  # agent/retriever/belief/query scorer settings of phase 1; its `output` holds the runs
  retriever: qwen3_emb_4b
  num_gpus: 4                       # dra_inference workers (phase 1)
  gpu_ids: null                     # their GPUs, e.g. "0,1,2,3" (phase 1); null = gpu_ids of the inference config
  max_seq_len: 32768                # longest student sequence (prompt + reply) in SFT and RL

# ── Phase 1: dra_inference on one pool split (sft, val: monitor; rl: off) ───
trajectories:
  split: sft                                        # sft | rl | val (build_training_pool.py split)
  teacher_belief_model: openrouter/qwen/qwen3.6-27b # belief model whose criteria (init) and updates are the SFT targets
  limit: null                                       # next N queries of the split not run yet (null = all)
  quiet: false                                      # minimal logs (no per-step agent output), as dra_inference --quiet

# ── Phase 2: SFT warm-up (LoRA, then merged) ─────────────────────────────────
# Samples from the monitor runs of the sft (train) and val splits; validation
# loss after every epoch on the val samples, the best checkpoint is merged.
sft:
  student_belief_model: Qwen/Qwen3.5-4B   # same generation and tokenizer as the teacher; Agent-BRACE: Qwen/Qwen3-4B-Instruct-2507
  require_verified_spans: true      # samples only from replies whose spans all occur in their passage
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, in_proj_z, out_proj, gate_proj, up_proj, down_proj]  # attention, Gated DeltaNet, MLP
  learning_rate: 1.0e-4               # Agent-BRACE: 2e-5; 1e-4 is the usual LoRA rate
  num_epochs: 3                       # upper bound; the best epoch by validation loss is kept
  per_device_batch_size: 1           # 1 x 32 = Agent-BRACE's 4 x 8; bounds memory up to shared.max_seq_len
  gradient_accumulation_steps: 32
  warmup_ratio: 0.03
  logging_steps: 5

# ── Phase 3: RL (GRPO on whole belief chains of the student, rl split, gold ─
#    criteria; PPO update of Agent-BRACE, no critic, no KL)
rl:
  init_belief_model: null          # null = phase2_sft/merged
  num_iterations: 200
  episodes_per_batch: 16            # rl episodes per iteration
  group_size: 8                     # chains per episode (GRPO group)
  reward_weight_step: 1.0           # w of R = w * sum_k (r_ret_k + r_reas_k) + r_final
  adv_std_floor: 0.05               # GDPO: each term (ret, reas, final) normalized in its group by max(std, floor)
  utilized_judge_model: openrouter/qwen/qwen3-32b  # gold of r_reas when no string match (the correctness judge); null = match only
  val_every: 20                     # validation (one greedy chain per val episode; selects final/) every N iterations
  val_max_episodes: 50
  learning_rate: 1.0e-5
  ppo_epochs: 1
  ppo_mini_batch_size: 32           # updater calls per optimizer step (~1000 calls per iteration)
  clip_ratio_low: 0.2
  clip_ratio_high: 0.28             # DAPO clip-higher
  clip_ratio_c: 3.0
  loss_agg_mode: token-mean
  grad_clip: 1.0
  use_kl_loss: false
  kl_loss_coef: 0.001
  kl_loss_type: low_var_kl
  temperature: 1.0
  max_new_tokens: 8192              # the inference updater's max_tokens
  vllm_gpu_memory_utilization: 0.55
  vllm_max_num_seqs: 64
  save_every: 20
  save_total_limit: 3               # step_{n}/ checkpoints kept
  sync_dir: /dev/shm/belief_model_training_sync

# ============================================================================
# Settings of experiments/training/train_belief_model.py (belief model
# training, agent frozen; src/belief_model_training).  One section per stage
# (belief_stage: the stages teacher and evaluate) plus `shared`; `data` holds
# the dataset build settings (stages data_prepare and data_relevance).  The keys are the dataclass fields
# of src/belief_model_training/shared/config.py, and for `data` those of
# src/indexing_corpus_dataset/training_datasets/config.py.
#
# Precedence (lowest -> highest):
#   dataclass defaults  <  this file  <  the flags --teacher (shared.teacher),
#   --student (shared.student), --init-model (rl.init_model), --beliefs (rl.beliefs)
#
# Hyperparameters follow Agent-BRACE (arXiv 2605.11436).  Every training run
# writes under BELIEF_TRAINING_ROOT (src/utils/models.py: OUTPUT_ROOT/belief_training):
# stats/ (stage generate), filter/ (stage filter), and per student
# {student}/sft/ (stage sft), {student}/rl/ and {student}/rl_own_init/ (stage
# rl); each run's final/ is served by dra_inference as {student}_sft,
# {student}_rl, {student}_rl_own_init (e.g. qwen3.5_4b_rl).
# ============================================================================

# ── Shared ───────────────────────────────────────────────────────────────────
shared:
  training_datasets: [infoseek_hard, trqa_val]   # their sft / rl / val splits; episodes pooled (one model)
  policy_models: [oss_20b, glm]       # frozen agents whose trajectories are the episodes
  retriever: qwen3_emb_4b
  teacher: qwen3.6_27b                # --belief-model of the teacher (its sft / val replies are the SFT samples)
  student: qwen3.5_4b                 # SFT start: a local base --belief-model (utils.models.STUDENT_BELIEF_MODELS)
  inference_config: experiments/configs/dra_inference.yaml  # the generate / teacher / evaluate inference settings; its `output` holds the runs
  seed: 0
  max_seq_len: 32768                  # longest student sequence (prompt + reply): longer SFT samples dropped, longer RL prompts get no reply

# ── Stages data_prepare, data_relevance: training datasets (one call each) ──
# infoseek_hard (InfoSeek-Hard), frames (FRAMES) and webshaper (WebShaper)
# over InfoSeek's wiki-25-512 corpus (webshaper also over its web gold pages,
# corpus_web.jsonl in data/training_datasets/corpus), and trqa_val (the TRQA wiki1 + wiki2
# validation files).  The sources and the checks of data_prepare are fixed
# in code (src/indexing_corpus_dataset/training_datasets/datasets/).  The
# source as loaded and every build file are kept in
# data/training_datasets_raw/{dataset}, the dataset in data/training_datasets
# (queries/{dataset}.jsonl, qrels/{dataset}.txt) of the repo.  data_prepare uses `web` only
# (webshaper); data_relevance uses `split`, `gold_beliefs`, `gold_passages`.
data:
  # Split: shares of the queries with the full gold annotation (level full);
  # every other query goes to val as its out-of-domain part (all of frames:
  # no beliefs).  A query keeps its split as the dataset grows; the new ones
  # fill the split furthest below its share.  Recorded in stats.json; other
  # shares are refused; to change them, remove the 'split' section of
  # stats.json (the next build re-splits every query).
  split:
    sft: 0.3                          # SFT samples (stage teacher: teacher beliefs)
    rl: 0.6                           # RL episodes (trajectories only, no teacher)
    val: 0.1                          # validation of SFT and RL (stage teacher: teacher beliefs); plus the out-of-domain queries

  # Belief texts of the gold annotation (end of every data_relevance run), and the facts
  # of frames and webshaper (what their gold passages must state).  An LLM
  # writes them; earlier ones are kept (belief_texts.jsonl, facts.jsonl of the
  # dataset); writing new ones needs OPENROUTER_API_KEY.  model (and the
  # prompts) must stay those of the kept ones; to change them, remove those files.
  gold_beliefs:
    model: openrouter/qwen/qwen3.6-27b  # the writer (the teacher belief model)
    workers: 8                        # concurrent LLM calls
    max_tokens: 4096

  # Judge of the gold passages (infoseek_hard, frames, webshaper): one call per
  # (fact, passage) pair, TRQA's property check (YES-SAME / YES-DIFFERENT /
  # NO-RELATED / NO-UNRELATED).  Earlier judgments are kept
  # (gold_passages.jsonl of the dataset); model (and the prompts) must stay
  # theirs; to change them, remove that file.
  gold_passages:
    model: openrouter/openai/gpt-4o-mini  # TRQA's judge
    workers: 16                       # concurrent LLM calls
    max_tokens: 16                    # the reply is one label

  # webshaper: its web gold pages, fetched live, else from the Wayback Machine.
  web:
    contact: null                     # e-mail or URL in the User-Agent; null = DRA_CONTACT (.env)
    timeout: 30.0
    max_retries: 4
    workers: 32                       # concurrent fetches (the Wayback Machine keeps its own rate)
    wayback: true                     # Wayback Machine fallback for failed live fetches
    wayback_rate_per_min: 15.0        # the archive refuses faster clients
    wayback_timestamp: "20250601"     # the snapshot closest to this date (WebShaper's)
    min_words: 50                     # fewer extracted words: a dead page

# ── Stage generate: dra_inference --stage generate on a split (the agents' trajectories) ─
generate:
  workers: 1                          # generate stage query workers (dra_inference --workers)
  quiet: true

# ── Stages teacher and evaluate: dra_inference --stage belief (teacher on sft, val; evaluation) ─
belief_stage:
  belief_workers: null                # belief stage threads (dra_inference --belief-workers; null = belief_workers of the inference config)
  quiet: true

# ── Stage filter: what is trained on (filter/sft_samples.jsonl, filter/rl_episodes.jsonl) ─
# SFT samples: every gated teacher reply is kept for now (the sample rule is
# filtering/rules.py keep_sample).
filter:
  sft_init_datasets: [infoseek_hard]  # gold beliefs as init samples (multi-hop: in the question's words; not TRQA's members)
  rl_max_chain_steps: null            # rl split: leave out episodes with more search iterations (with a document); set from stage generate stats
  workers: 8                          # threads replaying the teacher's beliefs

# ── Stage sft: SFT (LoRA, merged into {student}/sft/final) ──────────────────
sft:
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, in_proj_z, out_proj, gate_proj, up_proj, down_proj]  # attention, Gated DeltaNet, MLP
  learning_rate: 2.0e-5               # Agent-BRACE
  num_epochs: 5                       # upper bound; the epoch with the lowest validation loss is merged
  per_device_batch_size: 1            # 1 x 32 = Agent-BRACE's 4 x 8 effective batch
  gradient_accumulation_steps: 32
  warmup_ratio: 0.03
  logging_steps: 5

# ── Stage rl: RL (reward = gate x Brier of the final score; no transition reward) ─
rl:
  beliefs: gold                       # gold (run rl) | own (the student's init call, run rl_own_init)
  init_model: null                    # null = {student}/sft/final
  num_iterations: 200
  episodes_per_batch: 8               # episodes per iteration
  group_size: 8                       # chains per episode (GRPO group, same fixed trajectory)
  scorer_samples: 4                   # final-score replies per chain; the chain's reward is their mean
  temperature: 0.7                    # Agent-BRACE rollout temperature (validation: greedy)
  refill_rounds: 2                    # rollouts to replace groups without reward spread
  learning_rate: 1.0e-5               # Agent-BRACE belief lr
  ppo_epochs: 1
  ppo_mini_batch_chains: 4            # chains per optimizer step (Agent-BRACE mini-batch 4)
  clip_ratio_low: 0.2                 # PPO clip 0.2
  clip_ratio_high: 0.2
  clip_ratio_c: 3.0                   # dual-clip
  loss_agg_mode: token-mean
  grad_clip: 1.0
  use_kl_loss: false
  kl_loss_coef: 0.001
  kl_loss_type: low_var_kl
  val_every: 10                       # validation (greedy chains on the val episodes; selects final/ by s_T AUROC)
  val_max_episodes: null
  vllm_gpu_memory_utilization: 0.55
  vllm_max_num_seqs: 128
  save_every: 20
  save_total_limit: 3                 # step_{n}/ checkpoints kept
  sync_dir: /dev/shm/belief_training_sync

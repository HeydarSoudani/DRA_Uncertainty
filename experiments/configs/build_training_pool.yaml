# ============================================================================
# Settings of experiments/training/build_training_pool.py (deep_qa pool: questions of
# InfoSeek-Hard, WebShaper and FRAMES with their gold pages and hard negatives;
# trqa_validation uses gold_criteria and split only).  The sources and
# the dropped question types of step 1 are fixed in code; the keys below are
# the dataclass fields of src/indexing_corpus_dataset/training_pool/config.py.
#
# Precedence (lowest -> highest):
#   dataclass defaults  <  this file
# --limit and --source are CLI flags only (step 2 is incremental: the
# next N questions, of the given sources when --source is set; --limit 0
# rewrites the dataset files without fetching).  The pool is
# built under data/training_pool/{pool} of the repo.
# ============================================================================

# ── Shared ───────────────────────────────────────────────────────────────────
shared:
  contact: null                     # e-mail or URL in the User-Agent (required by step 2); null = DRA_CONTACT in .env
  timeout: 30.0                     # seconds per request
  max_retries: 4                    # retries on transport errors and HTTP 429 / 5xx

# ── Step 2: gold pages + Filter A ────────────────────────────────────────────
pages:
  wiki_lang: en                     # other-language Wikipedia pages are dropped
  wiki_workers: 3                   # Wikimedia asks for at most 3 concurrent requests
  wiki_rate_per_min: 180            # limit: 200/min with contact info in the User-Agent, 10/min without
  web_workers: 8
  wayback: true                     # Wayback Machine fallback for dead web pages
  wayback_rate_per_min: 15         # the archive refuses connections above ~15/min
  wayback_timestamp: "20250601"     # closest snapshot to when WebShaper was built
  min_words: 50                     # fewer extracted words = dead page (soft 404)
  min_page_share: 0.8               # Filter A, questions with web gold pages: this share of all their gold pages (Wikipedia-only: all)
# wiki_lang, min_words, min_page_share, wayback, wayback_timestamp must stay
# those of the earlier step 2 runs of the pool (recorded in stats.json); to change
# them, rebuild the pool from step 1.

# ── Step 3: hard negatives of the Wikipedia gold pages ──────────────────────
# Wikipedia API, with the rate and workers of 'pages'; web gold pages get none.
negatives:
  max_per_gold: 10                  # hard negatives kept per wiki gold page
  sources: [morelike, category]     # fill order: morelike (most similar text), category (siblings in the most specific categories)
  candidate_factor: 3               # candidates asked from each source per slot (skipped / failed ones leave slots to the next)
  dedup_threshold: 0.8              # skip a candidate whose word 5-gram containment with a corpus doc is >= this (step 4 reports with the same)
# negatives.* and pages.wiki_lang / min_words must stay those of the earlier
# step 3 runs (recorded in stats.json); to change them, remove
# negatives/index.jsonl and the 'step3' section of stats.json.

# ── Split (end of deep_qa step 2, trqa_validation build): shares of the queries
# with the full gold annotation (level full); every other query (deep_qa:
# WebShaper, FRAMES) goes to val as its out-of-domain part.
# A query keeps its split as the pool grows; the new ones fill the split
# furthest below its share, so the shares hold at every pool size.
# Recorded in stats.json; other shares are refused; to change them, remove
# the 'split' section of stats.json (the next step 2 run or trqa_validation
# build re-splits every query).
split:
  sft: 0.3                          # SFT samples (monitor mode, teacher replies)
  rl: 0.6                           # RL prompts (off mode)
  val: 0.1                          # validation of SFT and RL (monitor mode); plus the out-of-domain queries

# ── Criterion texts of the gold annotation (end of deep_qa step 2 and of the
# trqa_validation build) ─────────────────────────────────────────────────────
# An LLM writes the criterion texts from the question and the criteria's
# source structure; the gold answers, documents and level come from the
# source.  Earlier texts are kept (criterion_texts.jsonl of the pool);
# writing new ones needs OPENROUTER_API_KEY.  model (and the prompts) must
# stay those of the kept texts; to change them, remove criterion_texts.jsonl
# (every text is written again; every query keeps its split).
gold_criteria:
  model: openrouter/qwen/qwen3.6-27b  # the writer (the teacher belief model of training)
  workers: 8                        # concurrent LLM calls
  max_tokens: 4096

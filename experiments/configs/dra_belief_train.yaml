# Belief agent training config (SFT cold start + GRPO).
#
# Mostly-fixed knobs live here; frequently-varied ones are CLI flags on
# experiments/dra_belief_train.py and are merged on top of this file.
# Unknown keys are rejected, so a typo fails loudly.
#
# Defaults describe a real run (TRQA wiki1 validation, local retriever, vLLM
# policy server).  `--smoke` replaces policy / retrieval / updater / trainer /
# reward with mocks and the data with a synthetic set, so it runs on CPU.

stage: rl                 # rl | sft (teacher trajectories -> SFT data, then the SFT backend)
verbose: true
output_dir: null          # null = run_outputs/training/belief/<stage>_<time>
save_rollouts: true       # every scored group under output_dir/rollouts (sft: output_dir/sft/rollouts)

data:
  source: dataset         # synthetic (CPU) | dataset (indexing_corpus_dataset)
  dataset: trqa
  subset: wiki1           # TRQA collection
  dataset_year: validation   # TRQA split; test stays held out for evaluation
  query_key: text
  data_path: null         # null = the inference default for the dataset
  qrels_data_path: null
  min_relevance_score: null
  limit: null
  shuffle: true
  num_synthetic: 8

retrieval:                # as dra_inference.yaml; paths null = inference defaults
  retriever: qwen3_emb_4b
  index_dir: null
  corpus_path: null
  top_k: 100
  retrieval_input: subquery

rollout:
  policy: server          # mock | server (vLLM: token ids + logprobs)
  tool: retrieval         # mock | retrieval
  server_url: http://127.0.0.1:8000
  model: Qwen/Qwen3.5-9B  # policy (student) model served for rollouts; must match sft.base_model
  tokenizer: null         # null = model
  chat_template_kwargs:
    enable_thinking: false   # the protocol's <think> is the only reasoning, as at inference
  request_timeout: 600
  max_generations: 64     # hard cap on policy calls per rollout (turns + re-asks)
  temperature: 1.0
  top_k_docs: 5           # passages shown per search (inference: seen_top_k)
  group_size: 8           # rollouts per prompt (GRPO group)
  concurrency: 32

# The belief agent: BeliefAgentConfig fields, defaults of the belief_* keys in
# dra_inference.yaml.
agent:
  max_turns: 8
  max_passage_chars: 1500
  max_format_retries: 2
  max_tokens_per_call: 4096
  disable_native_thinking: true
  show_novelty: true
  show_criteria: true
  criteria_mode: auto     # auto (static on browsecomp_plus, else dynamic) | static | dynamic
  criteria_model: openrouter/qwen/qwen3.6-27b   # frozen updater; never the policy being trained
  max_criteria: 8
  stabilization_window: 15
  criteria_max_tokens: 1024
  evidence_top_k: 5
  evidence_chars: 1500

reward:
  outcome_metric: auto    # auto (trqa_exact on TRQA, llm_judge otherwise) | trqa_exact | llm_judge | mock
  judge_model: openrouter/qwen/qwen3-32b
  lambda_process: 0.0     # outcome only
  clamp_process: true

buffer:
  staleness_k: 1          # max weight-version lag (async)
  capacity: 4096

trainer:
  backend: mock           # mock (no weight update) | grpo (veRL adapter, TODO)
  lr: 1.0e-6
  kl_coef: 0.001
  save_dir: null
  save_every: 50
  extra: {}

sft:
  backend: none           # none (build data only) | verl (TODO)
  data_out: null          # null = output_dir/sft/sft_data.jsonl
  base_model: Qwen/Qwen3.5-9B   # SFT cold-start backbone; must match rollout.model
  teacher_model: openrouter/qwen/qwen3.6-27b
  teacher_temperature: 0.6
  samples_per_prompt: 1
  min_outcome: 1.0        # keep correct trajectories only
  drop_format_retries: true
  concurrency: 8
  epochs: 1
  extra: {}

rl:
  mode: sync              # sync (validate first) | async (production)
  total_steps: 1000
  prompts_per_step: 4
  seed: 0

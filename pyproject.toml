[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dra-training"
version = "0.1.0"
description = "Deep Research Agents — training and inference pipeline"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# One source root: src/ (utils and the component packages).
[tool.setuptools.packages.find]
where = ["src"]
include = [
    "utils*",
    "pipeline*",
    "deep_research_agents*",
    "evaluation*",
    "searcher_component*",
    "reasoner_component*",
    "belief_model_component*",
    "belief_model_training*",
    "indexing_corpus_dataset*",
]
